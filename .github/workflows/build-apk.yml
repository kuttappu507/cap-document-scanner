name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "build-apk" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Configure Capawesome registry
        run: printf '@capawesome-team:registry=https://npm.registry.capawesome.io\\n//npm.registry.capawesome.io/:_authToken=%s\\n' "${{ secrets.CAPAWESOME_NPM_TOKEN }}" > ~/.npmrc
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: docscan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
