<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Library</ion-title>
  </ion-toolbar>
  @if (hasDocuments()) {
    <ion-toolbar>
      <ion-searchbar
        placeholder="Search documents"
        [debounce]="300"
        [value]="query()"
        (ionInput)="query.set($event.detail.value ?? '')"
        aria-label="Search documents"
      ></ion-searchbar>
    </ion-toolbar>
  }
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Library</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid fixed class="ion-padding-horizontal">
    <ion-row>
      <ion-col size="12">
        @if (filtered().length) {
          <ion-list class="app-inset-list" aria-label="Saved documents">
            @for (document of filtered(); track document.id) {
              <ion-item-sliding #sliding>
                <app-document-item [document]="document" (selected)="openDocument($event)"></app-document-item>
                <ion-item-options side="end">
                  <ion-item-option color="danger" (click)="remove(document, sliding)" [attr.aria-label]="'Delete ' + document.title">
                    <ion-icon slot="icon-only" name="trash-outline" aria-hidden="true"></ion-icon>
                  </ion-item-option>
                </ion-item-options>
              </ion-item-sliding>
            }
          </ion-list>
        } @else if (hasDocuments()) {
          <app-empty-state icon="search-outline" heading="No matches" [message]="'Nothing is named “' + query() + '”.'"></app-empty-state>
        } @else {
          <app-empty-state
            icon="documents-outline"
            heading="Your library is empty"
            message="Scanned documents are saved here so you can view, share or open them as PDF."
          ></app-empty-state>
        }
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
